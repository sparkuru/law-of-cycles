[package]
name = "law-of-cycles"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A Linux CLI and terminal workspace for Mihomo"
license-file = "license"
default-run = "kami"

[[bin]]
name = "kami"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-util", "net"] }
toml = "0.8"
unicode-width = "0.2"
url = "2"

[profile.release]
lto = "thin"
strip = true
